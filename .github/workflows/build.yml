name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# This workflow only reads the repository and uploads its own artifacts. Naming that
# explicitly stops it inheriting whatever the repository default happens to be, which
# on older repositories is read/write on every scope.
permissions:
  contents: read

jobs:
  # Unit tests, lint and a full R8 release build. No keystore.properties exists on
  # CI, so the release output is unsigned - this job proves the build is sound, it
  # does not produce something publishable.
  build:
    name: Tests, lint and release build
    # Pinned rather than `ubuntu-latest`, which is migrating to Ubuntu 26.04 during
    # this release cycle. The toolchain here (JDK 21, Gradle, the repo's own Python)
    # is version-independent, so it takes the image it has been proven on.
    runs-on: ubuntu-24.04
    # Bounded, because the default is six hours and nothing here legitimately runs
    # for more than a few minutes. A job that hangs should fail while someone is
    # still looking at it.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          # Matches toolchainVersion in gradle/gradle-daemon-jvm.properties.
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # Two things a compiler cannot check and a person will not notice: whether
      # every text colour still clears WCAG on the surface it is drawn on, and
      # whether the two apps still agree on their palette. The second exists
      # because they silently disagreed for a while - three tokens fixed on
      # Android for measured contrast failures were left behind on the web, so
      # the same failures survived there until someone thought to look.
      # Verify design token contrast, palette parity, translations parity, and repo hygiene.
      - name: Static repository audit
        run: python tools/audit_repo.py

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Lint
        run: ./gradlew lintDebug --console=plain

      - name: Release build
        run: ./gradlew assembleRelease --console=plain

      - name: Report APK size
        run: |
          apk=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          printf '### Release APK\n\n`%s` — **%s**\n' \
            "$(basename "$apk")" "$(du -h "$apk" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore


  # Pinned, not `-latest`: ubuntu-latest is migrating to Ubuntu 26.04 ("resolute"),
  # and a job that installs nothing and only runs the project's own toolchain should
  # not change operating system because a label moved. The browser suite lives in its
  # own job (`browser`) so that this one never touches apt at all.
  web:
    name: PWA lint, tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # ci, not install: the lockfile is the input, and a job that silently
      # resolved a different tree would not be testing what deploys.
      - name: Install
        run: npm ci

      - name: Static analysis (lint)
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

  # The bulk of the suite runs inside Playwright's own image: the browsers and their
  # system libraries are already installed there, so nothing in this job depends on the
  # runner's apt mirror. That dependency is what turned the old combined job red four
  # times in two days - `npx playwright install --with-deps` spent 19m39s fetching 131
  # apt packages from a mirror that stalled for minutes between single requests, on
  # both Ubuntu 26.04 and 24.04 (runs 39875052521, 39876334832, 39881990195). More
  # timeout only bought a better coin flip.
  #
  # The image tag must match @playwright/test in web/package-lock.json. Bump both
  # together, or Playwright will complain about browsers it did not ship.
  browser:
    name: Browser and accessibility tests (Chromium, WebKit)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      # --init reaps the browser processes Playwright leaves behind; --ipc=host is
      # Playwright's own recommendation for its image.
      options: --init --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ci, not install: same reason as the web job. Node and npm come from the image.
      - name: Install
        run: npm ci

      # playwright.config.ts starts the production build (`next start -p 3200`)
      # itself, so the build has to exist before the suite runs.
      - name: Production build
        run: npm run build

      # Chromium carries the full functional, accessibility and visual suite; WebKit
      # runs the smaller compatibility/speech-fallback/logout contract and pulls
      # Chromium in as its declared dependency.
      - name: Browser and accessibility tests
        run: npx playwright test --project=chromium --project=webkit-smoke

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-chromium-webkit
          path: |
            web/playwright-report/
            web/test-results/
          if-no-files-found: ignore

  # Firefox cannot run inside that container. It builds its content sandbox out of an
  # unprivileged user namespace, and a container job is refused one:
  #   [pid=N][err] Sandbox: CanCreateUserNamespace() clone() failure: EPERM
  # Lifting seccomp, lifting the AppArmor profile, MOZ_DISABLE_CONTENT_SANDBOX=1 and
  # --cap-add=SYS_ADMIN all left it unchanged, while Chromium and WebKit pass in the
  # same image - so this is Firefox-specific, not a broken container. Its three tests
  # keep the host runner, and are now the only place apt is needed.
  browser-firefox:
    name: Browser tests (Firefox)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-firefox-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
          restore-keys: playwright-firefox-${{ runner.os }}-

      # One browser's dependencies, with retries: the mirror stalls for minutes at a
      # time rather than failing outright.
      - name: Install Firefox
        run: |
          for attempt in 1 2 3; do
            if npx playwright install --with-deps firefox; then
              exit 0
            fi
            echo "::warning::Firefox install failed (attempt $attempt); retrying in 30s"
            sleep 30
          done
          exit 1

      # playwright.config.ts starts the production build itself.
      - name: Production build
        run: npm run build

      # --no-deps: Chromium already ran in the job above, and this job owes only the
      # Firefox contract.
      - name: Firefox compatibility tests
        run: npx playwright test --project=firefox-smoke --no-deps

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-firefox
          path: |
            web/playwright-report/
            web/test-results/
          if-no-files-found: ignore

  # The Room migration and DAO tests need a real device. They cannot run on a
  # developer machine without an emulator attached, so this job is where they are
  # actually exercised.
  instrumented:
    name: Instrumented tests (${{ matrix.name }})
    # Pinned for the same reason as `build`: an emulator job is the last place to
    # absorb an unannounced OS change, and API 31/35/36 are the platforms under test,
    # not the host image.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # The floor runs the whole suite: minSdk is where the schema, the
          # permissions model and the migration paths are most likely to differ from
          # the developer's own device.
          - name: API 31 full suite
            api-level: 31
            script: ./gradlew connectedDebugAndroidTest --console=plain
          # The top of the range runs the version-gated contract instead. Oldest and
          # newest supported, not every level between: the point is to catch a
          # platform-version gate (POST_NOTIFICATIONS, data-extraction rules, the
          # on-device recogniser) behaving differently at the two ends.
          - name: API 35 platform smoke
            api-level: 35
            script: >-
              ./gradlew connectedDebugAndroidTest --console=plain
              -Pandroid.testInstrumentationRunnerArguments.class=com.aus.deutschflow.service.ModernPlatformContractTest,com.aus.deutschflow.service.OnDeviceRecognitionTest
          # Newest stable platform, and the closest emulator to targetSdk 37: there is
          # no API 37 system image to run against yet, so 36 is the frontier. Kept
          # alongside 35 because the two are where a current platform change lands
          # first, and a smoke job is cheap next to the full suite.
          - name: API 36 platform smoke
            api-level: 36
            script: >-
              ./gradlew connectedDebugAndroidTest --console=plain
              -Pandroid.testInstrumentationRunnerArguments.class=com.aus.deutschflow.service.ModernPlatformContractTest,com.aus.deutschflow.service.OnDeviceRecognitionTest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          # minSdk. The floor is where a migration is most likely to behave
          # differently from the developer's own device.
          api-level: ${{ matrix.api-level }}
          target: aosp_atd
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: ${{ matrix.script }}

      - name: Upload instrumented results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: instrumented-results-${{ matrix.api-level }}
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
