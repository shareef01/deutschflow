name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# This workflow only reads the repository and uploads its own artifacts. Naming that
# explicitly stops it inheriting whatever the repository default happens to be, which
# on older repositories is read/write on every scope.
permissions:
  contents: read

jobs:
  # Unit tests, lint and a full R8 release build. No keystore.properties exists on
  # CI, so the release output is unsigned - this job proves the build is sound, it
  # does not produce something publishable.
  build:
    name: Tests, lint and release build
    runs-on: ubuntu-latest
    # Bounded, because the default is six hours and nothing here legitimately runs
    # for more than a few minutes. `playwright install --with-deps` stalled twice on
    # an apt lock and burned 6h each time, on branches whose code had nothing to do
    # with it; the re-run finished in 1m37s. A job that hangs should fail while
    # someone is still looking at it.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          # Matches toolchainVersion in gradle/gradle-daemon-jvm.properties.
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # Two things a compiler cannot check and a person will not notice: whether
      # every text colour still clears WCAG on the surface it is drawn on, and
      # whether the two apps still agree on their palette. The second exists
      # because they silently disagreed for a while - three tokens fixed on
      # Android for measured contrast failures were left behind on the web, so
      # the same failures survived there until someone thought to look.
      - name: Design tokens
        run: |
          python tools/contrast.py
          python tools/palette_parity.py

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Lint
        run: ./gradlew lintDebug --console=plain

      - name: Release build
        run: ./gradlew assembleRelease --console=plain

      - name: Report APK size
        run: |
          apk=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          printf '### Release APK\n\n`%s` — **%s**\n' \
            "$(basename "$apk")" "$(du -h "$apk" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

  # The PWA in web/ is a second complete application, and until this job existed
  # nothing verified it on push: its type check, unit suite, production build and
  # browser smoke tests all passed only when somebody remembered to run them.
  web:
    name: PWA type check, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # ci, not install: the lockfile is the input, and a job that silently
      # resolved a different tree would not be testing what deploys.
      - name: Install
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      # The smoke suite drives a real browser: five routes, the responsive
      # breakpoint, the language switch, and offline boot - which is the only
      # thing that proves the service worker actually installs.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Browser smoke tests
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: web/playwright-report/
          if-no-files-found: ignore

  # The Room migration and DAO tests need a real device. They cannot run on a
  # developer machine without an emulator attached, so this job is where they are
  # actually exercised.
  instrumented:
    name: Instrumented tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          # minSdk. The floor is where a migration is most likely to behave
          # differently from the developer's own device.
          api-level: 31
          target: aosp_atd
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --console=plain

      - name: Upload instrumented results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: instrumented-results
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
